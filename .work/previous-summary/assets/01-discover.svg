<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">아이디어 탐색</title>
  <desc id="desc">새 출발점에서 여러 시안을 거쳐 방향을 선택하는 과정</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs>
  <rect width="960" height="180" fill="white"/>
  <g fill="none" stroke="#333" stroke-width="2">
    <rect x="20" y="48" width="250" height="84"/>
    <rect x="355" y="48" width="250" height="84"/>
    <rect x="690" y="48" width="250" height="84"/>
    <path d="M283 90 H338" marker-end="url(#arrow)"/>
    <path d="M618 90 H673" marker-end="url(#arrow)"/>
  </g>
  <g fill="#111" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="28" text-anchor="middle">
    <text x="145" y="100">새 출발점</text>
    <text x="480" y="100">여러 시안</text>
    <text x="815" y="100">방향 선택</text>
  </g>
</svg>
